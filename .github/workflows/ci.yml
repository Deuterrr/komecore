name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Code Formatting & Vetting
        run: |
          unformatted=$(gofmt -l internal cmd pkg seeds tools test)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files found:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...

      - name: Run Unit Tests with Race Detector
        run: |
          go test -v -race -count=1 ./...

      - name: Run Integration Tests with Race Detector
        run: |
          go test -v -race -count=1 -tags=integration ./test/integration/...

      - name: Build Application Binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/komecore ./cmd/komecore
          CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/migrate ./cmd/migrate
          CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/seed ./cmd/seed

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: komecore/api:ci
