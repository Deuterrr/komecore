name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Module Dependencies
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Code Formatting & Vetting
        run: |
          unformatted=$(gofmt -l internal cmd pkg test)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files found:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...

      - name: Lint OpenAPI Specification (Spectral)
        run: |
          npx --yes @stoplight/spectral-cli lint api/openapi.yaml --ruleset .spectral.yaml --fail-severity=warn

      - name: Run OpenAPI Contract & Golden Snapshot Tests
        run: |
          go test -v -count=1 ./test/contract/...

      - name: Verify OpenAPI Backward Compatibility (oasdiff)
        if: github.event_name == 'pull_request'
        run: |
          go install github.com/oasdiff/oasdiff@latest
          if git show "origin/${{ github.base_ref }}:api/openapi.yaml" > /tmp/base_openapi.yaml 2>/dev/null; then
            oasdiff breaking /tmp/base_openapi.yaml api/openapi.yaml
          fi

      - name: Run Unit Tests with Race Detector
        run: |
          go test -v -race -count=1 ./...

      - name: Run Integration Tests with Race Detector
        run: |
          go test -v -race -count=1 -tags=integration ./test/integration/...

      - name: Build Application Binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/komecore ./cmd/komecore

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: komecore/api:ci
