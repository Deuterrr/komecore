          $ref: '#/components/schemas/SelectedCourierResponse'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItemResponse'

    CheckoutCalculateResponse:
      type: object
      required: [address, shops, subtotal, total_shipping, selected_payment_method]
      properties:
        address:
          $ref: '#/components/schemas/CheckoutAddressResponse'
        shops:
          type: array
          items:
            $ref: '#/components/schemas/ShopCalculateResponse'
        subtotal: { type: integer, format: int64 }
        total_shipping: { type: integer, format: int64 }
        total: { type: integer, format: int64, nullable: true }
        selected_payment_method:
          $ref: '#/components/schemas/PaymentMethodResponse'

    ShopResponse:
      type: object
      required: [shop_id, name, slug, subtotal, items, cost_couriers]
      properties:
        shop_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        subtotal: { type: integer, format: int64 }
        total: { type: integer, format: int64, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItemResponse'
        cost_couriers:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutCouriersResponse'

    CheckoutResponse:
      type: object
      required: [address, shops, subtotal, total_shipping, payment_methods]
      properties:
        address:
          $ref: '#/components/schemas/CheckoutAddressResponse'
        shops:
          type: array
          items:
            $ref: '#/components/schemas/ShopResponse'
        subtotal: { type: integer, format: int64 }
        total_shipping: { type: integer, format: int64 }
        total: { type: integer, format: int64, nullable: true }
        payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodResponse'

    # Logistics Schemas
    ListCouriersResponse:
      type: object
      required: [couriers]
      properties:
        couriers:
          type: array
          items: { type: string, example: "jne" }

    EstimateShippingOptionsRequest:
      type: object
      required: [shop_id, origin, destination, weight]
      properties:
        shop_id: { type: string, example: "c0000000-0000-0000-0000-000000000001" }
        origin: { type: integer, example: 3173 }
        destination: { type: integer, example: 3174 }
        weight: { type: integer, example: 1000 }
        price_filter: { type: string, nullable: true, example: "lowest" }

    EstimateShippingOptionsResponse:
      type: object
      required: [name, code, service, description, cost, etd]
      properties:
        name: { type: string, example: "JNE Regular" }
        code: { type: string, example: "jne" }
        service: { type: string, example: "REG" }
        description: { type: string, example: "Layanan Reguler JNE" }
        cost: { type: integer, format: int64, example: 15000 }
        etd: { type: string, example: "1-2" }
        estimated_duration_hours: { type: number, format: double, nullable: true }
        sla_confidence_score: { type: number, format: double, nullable: true }
        delivery_status: { type: string, nullable: true }

    # Order Schemas
    CreateOrderItemRequest:
      type: object
      required: [product_id, name, quantity]
      properties:
        product_id: { type: string, format: uuid, example: "b0000000-0000-0000-0000-000000000001" }
        name: { type: string, example: "Organic Kome Rice" }
        quantity: { type: integer, minimum: 1, example: 2 }
        item_options:
          type: object
          additionalProperties: { type: string }

    CreateOrderCourierRequest:
      type: object
      required: [code, service]
      properties:
        code: { type: string, example: "jne" }
        service: { type: string, example: "REG" }

    CreateOrderShopRequest:
      type: object
      required: [shop_id, name, items]
      properties:
        shop_id: { type: string, format: uuid, example: "c0000000-0000-0000-0000-000000000001" }
        name: { type: string, example: "Kome Central Store" }
        selected_courier:
          $ref: '#/components/schemas/CreateOrderCourierRequest'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderItemRequest'

    CreateOrderPaymentRequest:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid, example: "d0000000-0000-0000-0000-000000000001" }

    CreateOrderRequest:
      type: object
      required: [address_id, selected_payment, shops]
      properties:
        address_id: { type: string, format: uuid, example: "e0000000-0000-0000-0000-000000000001" }
        selected_payment:
          $ref: '#/components/schemas/CreateOrderPaymentRequest'
        shops:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderShopRequest'

    CreateOrderPaymentAccountResponse:
      type: object
      required: [account_name]
      properties:
        account_name: { type: string }
        account_number: { type: string, nullable: true }
        phone_number: { type: string, nullable: true }
        qr_string: { type: string, nullable: true }

    PaymentChannelDataResponse:
      type: object
      required: [channel_type, display_name]
      properties:
        channel_type: { type: string }
        display_name: { type: string }
        action_url: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }

    CreateOrderResponse:
      type: object
      required: [order_id]
      properties:
        order_id: { type: string, format: uuid }
        instruction: { type: string, nullable: true }
        payment_account:
          $ref: '#/components/schemas/CreateOrderPaymentAccountResponse'
        channel_data:
          $ref: '#/components/schemas/PaymentChannelDataResponse'

    ShipmentDispatchRequest:
      type: object
      required: [fulfillment_method, courier, service, item_ids]
      properties:
        fulfillment_method: { type: string, example: "courier" }
        courier: { type: string, example: "jne" }
        service: { type: string, example: "REG" }
        tracking_number: { type: string, nullable: true }
        item_ids:
          type: array
          items: { type: string }

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, example: "processing" }
        tracking_number: { type: string, nullable: true }
        fulfillment_method: { type: string, nullable: true, example: "courier" }
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentDispatchRequest'

    DispatchShopShipmentRequest:
      type: object
      required: [shop_id, fulfillment_method, courier, service, item_ids]
      properties:
        shop_id: { type: string, format: uuid }
        fulfillment_method: { type: string, example: "courier" }
        courier: { type: string, example: "jne" }
        service: { type: string, example: "REG" }
        tracking_number: { type: string, nullable: true }
        item_ids:
          type: array
          items: { type: string }

    OrderItemResponse:
      type: object
      required: [id, product_id, product_name, quantity, unit_price, subtotal, shop_id, shop_name, shipping_fee]
      properties:
        id: { type: string }
        shipment_id: { type: string, nullable: true }
        product_id: { type: string }
        product_name: { type: string }
        quantity: { type: integer }
        unit_price: { type: integer, format: int64 }
        subtotal: { type: integer, format: int64 }
        shop_id: { type: string }
        shop_name: { type: string }
        courier_code: { type: string, nullable: true }
        courier_service: { type: string, nullable: true }
        shipping_fee: { type: integer, format: int64 }
        item_options:
          type: object
          additionalProperties: { type: string }

    PaymentDetailResponse:
      type: object
      required: [id, status, provider, amount, created_at]
      properties:
        id: { type: string }
        status: { type: string, example: "pending" }
        provider: { type: string, example: "midtrans" }
        amount: { type: integer, format: int64 }
        expires_at: { type: string, format: date-time, nullable: true }
        channel_data:
          $ref: '#/components/schemas/PaymentChannelDataResponse'
        created_at: { type: string, format: date-time }

    ShipmentEventResponse:
      type: object
      required: [id, status, description, location, timestamp]
      properties:
        id: { type: string }
        status: { type: string }
        description: { type: string }
        location: { type: string }
        timestamp: { type: string, format: date-time }

    ShipmentDetailResponse:
      type: object
      required: [id, order_id, status, fulfillment_method, courier, service, cost, created_at]
      properties:
        id: { type: string }
        order_id: { type: string }
        status: { type: string }
        fulfillment_method: { type: string }
        courier: { type: string }
        service: { type: string }
        tracking_number: { type: string, nullable: true }
        cost: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        events:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentEventResponse'
        item_ids:
          type: array
          items: { type: string }

    OrderAddressResponse:
      type: object
      required: [id, customer_id, receiver_name, is_default, province, city, district, full_address, postal_code]
      properties:
        id: { type: string }
        customer_id: { type: string }
        receiver_name: { type: string }
        phone: { type: string, nullable: true }
        is_default: { type: boolean }
        province: { type: string }
        city: { type: string }
        district: { type: string }
        province_id: { type: string, nullable: true }
        city_id: { type: string, nullable: true }
        district_id: { type: string, nullable: true }
        village_id: { type: string, nullable: true }
        full_address: { type: string }
        postal_code: { type: string }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }

    OrderResponse:
      type: object
      required: [id, number, customer_id, address_id, status, subtotal, shipping_fee, total, created_at, items, shipments]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "ORD-20260930-001" }
        customer_id: { type: string, format: uuid }
        address_id: { type: string, format: uuid }
        status: { type: string, example: "pending" }
        subtotal: { type: integer, format: int64 }
        shipping_fee: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        confirmed_at: { type: string, format: date-time, nullable: true }
        handling_expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        payment:
          $ref: '#/components/schemas/PaymentDetailResponse'
        shipment:
          $ref: '#/components/schemas/ShipmentDetailResponse'
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentDetailResponse'
        address:
          $ref: '#/components/schemas/OrderAddressResponse'

    TrackingTimelineEventResponse:
      type: object
      required: [status, description, location, timestamp]
      properties:
        status: { type: string }
        description: { type: string }
        location: { type: string }
        timestamp: { type: string, format: date-time }

    OrderTrackingResponse:
      type: object
      required: [order_id, shipment_id, courier, timeline]
      properties:
        order_id: { type: string }
        shipment_id: { type: string }
        courier: { type: string }
        tracking_number: { type: string, nullable: true }
        warning: { type: string, nullable: true }
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TrackingTimelineEventResponse'

    # Shipment Schemas
    UpdateShipmentStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, example: "shipped" }
        description: { type: string, nullable: true }
        location: { type: string, nullable: true }

    UpdateShipmentRequest:
      type: object
      properties:
        tracking_number: { type: string, nullable: true, example: "JNE123456789" }
        courier: { type: string, nullable: true, example: "jne" }
        service: { type: string, nullable: true, example: "REG" }

    DispatchShipmentRequest:
      type: object
      required: [tracking_number]
      properties:
        tracking_number: { type: string, example: "JNE123456789" }

    ShipmentResponse:
      type: object
      required: [id, order_id, status, fulfillment_method, courier, service, cost, weight, created_at]
      properties:
        id: { type: string }
        order_id: { type: string }
        status: { type: string }
        fulfillment_method: { type: string }
        tracking_number: { type: string, nullable: true }
        courier: { type: string }
        service: { type: string }
        cost: { type: integer, format: int64 }
        weight: { type: integer }
        created_at: { type: string, format: date-time }

    # Payment Schemas
    UpdatePaymentMethodActiveRequest:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean, example: true }

    SavePaymentInstructionRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, example: "Transfer to BCA account 1234567890." }

    PaymentInstructionResponse:
      type: object
      required: [id, content, created_at]
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        created_at: { type: string, format: date-time }

    CheckPaymentStatusResponse:
      type: object
      required: [status, synced]
      properties:
        status: { type: string, example: "settlement" }
        synced: { type: boolean, example: true }
