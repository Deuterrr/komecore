# ==============================================================================
# COMPONENTS & SCHEMAS
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pass JWT token in Authorization header (e.g. `Bearer <token>`).
    CookieCustomerAuth:
      type: apiKey
      in: cookie
      name: kome_customer_access
      description: Standard HTTP-only cookie set on customer login.
    CookieStaffAuth:
      type: apiKey
      in: cookie
      name: kome_staff_access
      description: Standard HTTP-only cookie set on staff login.

  responses:
    BadRequest:
      description: Invalid request body, parameters, or malformed UUID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or invalid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - insufficient permissions or actor type mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict (e.g. username or email already exists)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    MessageResponse:
      type: object
