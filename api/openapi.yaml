    VerifyPasswordResetRequest:
      type: object
      required: [challenge_id, otp]
      properties:
        challenge_id: { type: string, format: uuid, example: "a0000000-0000-0000-0000-000000000001" }
        otp: { type: string, minLength: 6, maxLength: 6, example: "123456" }

