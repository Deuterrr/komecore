openapi: 3.0.3
info:
  title: Komecore API Specification
  description: High-performance general e-commerce engine REST API built in Go (Chi v5). Contains full, exact documentation for all endpoints matching Go DTO structs.
  version: 1.0.0
servers:
  - url: http://localhost:7129
    description: Local Development Server

tags:
  - name: Health
    description: Health check and service readiness
  - name: Authentication
    description: Identity, session cookies, tokens, and OAuth
  - name: Profile
    description: Current actor profile retrieval and updates
  - name: Users
    description: Customer user accounts and saved addresses
  - name: Staff Administration
    description: Staff management and administrative account controls
  - name: Catalog
    description: Product listings, management, stats, and image uploads
  - name: Shops & Inventories
    description: Merchant shop profiles, addresses, and stock levels
  - name: Cart & Checkout
    description: Customer shopping cart, estimation, and order checkout
  - name: Couriers & Logistics
    description: Available couriers and shipping rate calculation
  - name: Orders
    description: Order placement, tracking, and status lifecycle
  - name: Shipments
    description: Shipment tracking, waybills, and dispatching
  - name: Payments
    description: Payment methods, instructions, and Midtrans webhook

paths:
  /health:
    get:
      summary: Health check endpoint
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }

  # ==============================================================================
  # AUTHENTICATION & IDENTITY
  # ==============================================================================
  /api/v1/auth/signin:
    post:
      summary: Customer Sign In
      description: Authenticates a customer by email and password. Sets HTTP-only session cookies (kome_customer_access, kome_customer_refresh).
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInEmailRequest'
      responses:
        '200':
          description: Authenticated successfully. Cookies are set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "login success"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/staff/signin:
    post:
      summary: Staff / Admin Sign In
      description: Authenticates a staff member by email and password. Sets HTTP-only session cookies (kome_staff_access, kome_staff_refresh).
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInEmailRequest'
      responses:
        '200':
          description: Staff authenticated successfully. Cookies are set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "login success"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/signup:
    post:
      summary: Register Customer Account
      description: Registers a new customer and sends an OTP verification code.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Verification code sent with challenge ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/verify:
    post:
      summary: Verify Account OTP
      description: Verifies customer OTP code using the challenge ID. Authenticates customer upon success.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAccountRequest'
      responses:
        '200':
          description: Verification success. Session cookies are set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "verify success"
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/forgot-password:
    post:
      summary: Request Password Reset (Customer)
      description: Initiates a password reset challenge for a customer account.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset challenge initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'

  /api/v1/auth/staff/forgot-password:
    post:
      summary: Request Password Reset (Staff)
      description: Initiates a password reset challenge for a staff account.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset challenge initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'

  /api/v1/auth/forgot-password/verify:
    post:
      summary: Verify Password Reset OTP
      description: Validates the 6-digit OTP code against the challenge ID.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordResetRequest'
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPasswordResetResponse'

  /api/v1/auth/forgot-password/reset:
    post:
      summary: Reset Password
      description: Resets password using the verified challenge ID.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "password reset successful"

  /api/v1/auth/refresh:
    post:
      summary: Refresh Customer Token
      description: Obtains a new access token using a refresh token (from body or kome_customer_refresh cookie).
      tags:
        - Authentication
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'

  /api/v1/auth/staff/refresh:
    post:
      summary: Refresh Staff Token
      description: Obtains a new access token for staff (from body or kome_staff_refresh cookie).
      tags:
        - Authentication
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'

  /api/v1/auth/logout:
    post:
      summary: Customer Logout
      description: Invalidates customer session and clears cookies.
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - CookieCustomerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "logout success"

  /api/v1/auth/staff/logout:
    post:
      summary: Staff Logout
      description: Invalidates staff session and clears cookies.
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "logout success"

  /api/v1/auth/me:
    get:
      summary: Get Current Customer Identity & Roles
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - CookieCustomerAuth: []
      responses:
        '200':
          description: Customer auth info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'

  /api/v1/auth/staff/me:
    get:
      summary: Get Current Staff Identity & Roles
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      responses:
        '200':
          description: Staff auth info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'

  /api/v1/auth/google/login:
    get:
      summary: Initiate Google OAuth2 Login
      tags:
        - Authentication
      responses:
        '302':
          description: Redirect to Google authorization screen

  /api/v1/auth/google/callback:
    get:
      summary: Google OAuth2 Callback
      tags:
        - Authentication
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Authenticated successfully via Google. Session cookies set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ==============================================================================
  # PROFILE & USERS
  # ==============================================================================
  /api/v1/profile:
    get:
      summary: Get Current Profile
      description: Returns profile details of the currently authenticated customer or staff member.
      tags:
        - Profile
      security:
        - BearerAuth: []
        - CookieCustomerAuth: []
        - CookieStaffAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/ProfileResponse'
    put:
      summary: Update Current Profile
      tags:
        - Profile
      security:
        - BearerAuth: []
        - CookieCustomerAuth: []
        - CookieStaffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/ProfileResponse'
    delete:
      summary: Delete Customer Account
      description: Soft deletes the customer account and invalidates sessions.
      tags:
        - Profile
      security:
        - BearerAuth: []
        - CookieCustomerAuth: []
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "account deleted successfully"

  /api/v1/profile/staff:
    get:
      summary: Get Current Staff Profile
      tags:
        - Profile
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      responses:
        '200':
          description: Staff profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/ProfileResponse'
    put:
      summary: Update Current Staff Profile
      tags:
        - Profile
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Staff profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/ProfileResponse'

  /api/v1/users/{id}:
    get:
      summary: Get User by ID (Staff Admin)
      tags:
        - Users
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /api/v1/users/me:
    get:
      summary: Get Current User Account (Customer)
      tags:
        - Users
      security:
        - BearerAuth: []
        - CookieCustomerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  me:
                    $ref: '#/components/schemas/UserResponse'

  /api/v1/users/me/addresses:
    get:
      summary: List Saved Customer Addresses
      tags:
        - Users
      security:
        - BearerAuth: []
        - CookieCustomerAuth: []
      responses:
        '200':
          description: Customer addresses list
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerAddressResponse'
    post:
      summary: Create or Save Customer Address
      tags:
        - Users
      security:
        - BearerAuth: []
        - CookieCustomerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCustomerAddressRequest'
      responses:
        '200':
          description: Address created or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    $ref: '#/components/schemas/CustomerAddressResponse'

  /api/v1/users/me/addresses/{addressID}:
    delete:
      summary: Delete Customer Address
      tags:
        - Users
      security:
        - BearerAuth: []
        - CookieCustomerAuth: []
      parameters:
        - name: addressID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Address deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "address deleted"

  # ==============================================================================
  # STAFF ADMINISTRATION
  # ==============================================================================
  /api/v1/staff:
    get:
      summary: Find Staff Members (Staff Admin)
      tags:
        - Staff Administration
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: id
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated staff list
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
                  staff:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffResponse'
    post:
      summary: Create Staff Member Profile (Staff Admin)
      tags:
        - Staff Administration
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Staff profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'

  /api/v1/staff/{staffID}:
    put:
      summary: Update Staff Member Profile (Staff Admin)
      tags:
        - Staff Administration
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      parameters:
        - name: staffID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffRequest'
      responses:
        '200':
          description: Staff profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
    delete:
      summary: Delete Staff Member (Staff Admin)
      tags:
        - Staff Administration
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      parameters:
        - name: staffID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Staff deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/v1/staff/{staffID}/accounts:
    get:
      summary: List Staff Accounts (Staff Admin)
      tags:
        - Staff Administration
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      parameters:
        - name: staffID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of linked accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListStaffAccountsResponse'
    post:
      summary: Add Staff Account with Login Credentials (Staff Admin)
      tags:
        - Staff Administration
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      parameters:
        - name: staffID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddStaffAccountRequest'
      responses:
        '201':
          description: Staff account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccountResponse'

  /api/v1/staff/{staffID}/accounts/{accountID}:
    delete:
      summary: Remove Staff Account (Staff Admin)
      tags:
        - Staff Administration
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      parameters:
        - name: staffID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: accountID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Account removed

  # ==============================================================================
  # CATALOG & PRODUCTS
  # ==============================================================================
  /api/v1/products:
    get:
      summary: Find & Filter Products Catalog
      tags:
        - Catalog
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: name
          in: query
          schema: { type: string }
        - name: id
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, example: "price_asc" }
        - name: shop_id
          in: query
          schema: { type: string }
        - name: shop_slug
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, archived] }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Paginated products catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductCatalogResponse'
    post:
      summary: Create or Save Product (Staff)
      tags:
        - Catalog
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProductRequest'
      responses:
        '201':
          description: Product created or saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'

  /api/v1/products/stats:
    get:
      summary: Get Product Sales & Conversion Statistics (Staff Admin)
      tags:
        - Catalog
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: name
          in: query
          schema: { type: string }
        - name: id
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Product performance stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductStatsResponse'

  /api/v1/products/{slug}:
    get:
      summary: Get Product Detail by Slug
      tags:
        - Catalog
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product details with stock availability and gallery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'

  /api/v1/products/id/{id}:
    delete:
      summary: Delete Product (Staff Admin)
      tags:
        - Catalog
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Product deleted

  /api/v1/products/id/{id}/images:
    post:
      summary: Upload Product Images (Staff)
      description: Uploads one or more product images via multipart/form-data. The primary image is generated first.
      tags:
        - Catalog
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more image files (JPEG, PNG, WEBP)
      responses:
        '200':
          description: Images uploaded and resized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "images uploaded"

  # ==============================================================================
  # SHOPS & INVENTORIES
  # ==============================================================================
  /api/v1/shops:
    get:
      summary: Find Shops
      tags:
        - Shops & Inventories
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: name
          in: query
          schema: { type: string }
        - name: id
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: string }
        - name: approval_status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Shops list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListShopsResponse'
    post:
      summary: Create Shop (Staff Admin)
      tags:
        - Shops & Inventories
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveShopRequest'
      responses:
        '201':
          description: Shop created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetShopResponse'

  /api/v1/shops/{shopID}:
    get:
      summary: Get Shop by ID or Slug
      tags:
        - Shops & Inventories
      parameters:
        - name: shopID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Shop details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetShopResponse'
    put:
      summary: Update Shop Profile (Staff with Permission)
      tags:
        - Shops & Inventories
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
      parameters:
        - name: shopID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveShopRequest'
      responses:
        '200':
          description: Shop updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetShopResponse'
    delete:
      summary: Delete Shop (Staff Admin)
      tags:
        - Shops & Inventories
      security:
        - BearerAuth: []
        - CookieStaffAuth: []
